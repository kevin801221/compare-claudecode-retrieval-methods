[project]
name = "retrieval-lab"
version = "0.1.0"
description = "比較資料整理方式對 Claude Code 檢索與回答準確度的影響"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
